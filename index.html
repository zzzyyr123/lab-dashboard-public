<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>实验室数据看板</title>
            <style>
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            max-width: 1200px; 
            margin: auto; 
            padding: 20px; 
            line-height: 1.6; 
            color: #333; 
            background-color: #ffffff; /* 把背景换成纯白，手机看着更舒服 */
        }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 30px; font-size: 24px; }
        h2 { border-left: 5px solid #4E79A7; padding-left: 10px; margin-top: 40px; color: #2c3e50; font-size: 20px; }
        
        .image-gallery { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 20px; 
            margin-top: 20px; 
            margin-bottom: 40px;
        }
        
        /* 图片样式 */
        .image-gallery img { 
            width: 100%;       /* 在手机上占满 100% 宽度 */
            max-width: 1000px; /* 限制大屏幕上的最大宽度 */
            height: auto;      /* 确保比例不拉伸 */
            border: 1px solid #eee; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
        }
        
        .download-section { text-align: center; margin: 30px 0; }
        .btn-download { 
            display: inline-block;
            background-color: #4E79A7; 
            color: white; 
            padding: 12px 24px; /* 按钮尺寸微调 */
            font-size: 16px; 
            font-weight: bold;
            text-decoration: none; 
            border-radius: 50px; 
            box-shadow: 0 4px 15px rgba(78, 121, 167, 0.4);
        }
        
        /* 针对手机屏幕的特殊优化 */
        @media (max-width: 768px) {
            body { padding: 10px; }
            h1 { font-size: 20px; }
            h2 { font-size: 18px; margin-top: 30px; }
            .image-gallery img { 
                box-shadow: none; /* 手机上去掉阴影，减少性能消耗 */
                border-radius: 4px;
            }
        }
    </style>
</head>
<body>
    <h1>实验室数据看板</h1>

    <!-- 下载区放在最上面，方便老师直接下载 -->
    <div class="download-section">
        <a href="./results.pdf" download class="btn-download">📥 点击下载最新完整分析报告 (PDF)</a>
    </div>
    <hr>

    <!-- 体重 -->
    <h2>1. 体重数据 (Weight)</h2>
    <div class="image-gallery">
        <img src="./images/weight_plot1.png" alt="体重趋势与AUC图">
        <img src="./images/weight_plot2.png" alt="个体体重轨迹图">
    </div>

    <!-- 血糖 -->
    <h2>2. 血糖数据 (Glucose)</h2>
    <div class="image-gallery">
        <img src="./images/glucose_plot1.png" alt="血糖趋势与AUC图">
        <img src="./images/glucose_plot2.png" alt="个体血糖矩阵图">
    </div>

    <!-- 饮食饮水 -->
    <h2>3. 饮食饮水 (Food & Water Intake)</h2>
    <div class="image-gallery">
        <img src="./images/intake_plot1.png" alt="饮食饮水图">
    </div>

</body>
</html>
